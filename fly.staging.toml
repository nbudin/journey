# Staging environment: deploy with `fly deploy -c fly.staging.toml --remote-only`.
# Builds from the local Dockerfile (production pulls a prebuilt image from ghcr), so any branch can be deployed.
#
# Staging holds a copy of production data, so it deliberately has no working SMTP credentials and no
# Rollbar token: it must not email real people or report errors into production's Rollbar project.

app = "journeysurveys-staging"
primary_region = "iad"
swap = 512

[deploy]
release_command = "bundle exec rake db:migrate"
strategy = "rolling"

[env]
ILLYAN_URL = "https://accounts.sugarpond.net"
PORT = "3000"
RAILS_ENV = "production"
RAILS_LOG_TO_STDOUT = "1"
SUGAR_POND_BRANDING = "1"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 3000
min_machines_running = 0

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/questionnaires"
timeout = "5s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
